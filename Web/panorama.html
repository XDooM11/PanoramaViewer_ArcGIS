<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapy.com Panorama</title>
<style>
/* The viewport is determined by the window, never by canvas bitmap dimensions. */
html, body {
  width:100%; height:100%; margin:0; padding:0;
  overflow:hidden; background:#17202b;
}
#root {
  position:fixed; inset:0; width:100%; height:100%;
  overflow:hidden; contain:strict;
}
.mount {
  /* Keep the API's host bounded even if it sets an inline position/size. */
  position:absolute !important; inset:0 !important;
  width:100% !important; height:100% !important;
  min-width:0; min-height:0; max-width:100%; max-height:100%;
  padding:0; margin:0; border:0; box-sizing:border-box;
  overflow:hidden; contain:strict;
}
.mount canvas {
  display:block; max-width:100%; max-height:100%;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://api.mapy.com/js/panorama/v1/panorama.js"></script>
<script>
'use strict';
let active = null;
let generation = 0;
let currentRequestId = null;
let currentPoint = null;
let currentCamera = null;
const root = document.getElementById('root');
function post(message) { window.chrome?.webview?.postMessage(message); }
function report(requestId, state, message = '') { post({type:'status', requestId, state, message}); }

// BEGIN CAMERA REPORTER 1.2 -- identical in both HTML pages.
// Event driven: max 10 messages/s, one in-flight message, latest snapshot wins.
// An ACK from the host prevents a backlog if ArcGIS' UI thread is busy.
function createCameraReporter(read, send) {
  let timer = null, dirty = false, inFlight = null, last = null;
  let lastAt = -Infinity, sequence = 0, disposed = false;
  function schedule() {
    if (disposed || !dirty || inFlight || timer !== null) return;
    const wait = Math.max(0, 100 - (performance.now() - lastAt));
    timer = setTimeout(flush, wait);
  }
  function flush() {
    timer = null;
    if (disposed || !dirty || inFlight) return;
    dirty = false;
    const snapshot = read();
    if (!snapshot) return;
    const signature = JSON.stringify(snapshot);
    if (signature === last) return;
    last = signature;
    lastAt = performance.now();
    inFlight = {requestId: snapshot.requestId, seq: ++sequence};
    send({type:'camera', ...snapshot, seq:inFlight.seq});
  }
  return {
    changed() { if (!disposed) { dirty = true; schedule(); } },
    ack(message) {
      if (!inFlight || message.requestId !== inFlight.requestId || message.seq !== inFlight.seq) return;
      inFlight = null;
      schedule();
    },
    reset() {
      if (timer !== null) clearTimeout(timer);
      timer = null; dirty = false; inFlight = null; last = null;
      // Keep lastAt and sequence to maintain the rate limit across requests.
    },
    dispose() { this.reset(); disposed = true; }
  };
}
// END CAMERA REPORTER 1.2

function readCamera(value) {
  for (const camera of [value, value?.camera, value?.detail, value?.data]) {
    if (camera && Number.isFinite(camera.yaw) && Number.isFinite(camera.fov) && camera.fov > 0) {
      return {
        heading: ((camera.yaw * 180 / Math.PI) % 360 + 360) % 360,
        fov: Math.min(180, camera.fov * 180 / Math.PI)
      };
    }
  }
  return null;
}
const reporter = createCameraReporter(() => {
  if (!active || !currentPoint || currentRequestId === null) return null;
  // Read only. Never setCamera() in response to tracking/ACK/map updates.
  try { currentCamera = readCamera(active.getCamera?.()) || currentCamera; } catch (_) {}
  return {requestId:currentRequestId, ...currentPoint,
    heading:currentCamera?.heading ?? null, fov:currentCamera?.fov ?? null};
}, post);


// The API documents lon/lat for panorama info. Event wrappers are normalised
// defensively; never fall back to the clicked point or an old panorama position.
function readPosition(value) {
  for (const point of [value, value?.info, value?.position, value?.coords, value?.detail, value?.data]) {
    if (!point || typeof point !== 'object') continue;
    const lon = point.lon ?? point.lng ?? point.longitude;
    const lat = point.lat ?? point.latitude;
    if (typeof lon === 'number' && typeof lat === 'number' &&
        Number.isFinite(lon) && Number.isFinite(lat) && Math.abs(lon) <= 180 && Math.abs(lat) <= 90) {
      return {lon,lat};
    }
  }
  return null;
}
function position(requestId, value) {
  const point = readPosition(value);
  currentPoint = point;
  if (point) reporter.changed();
  else { reporter.reset(); post({type:'position-unavailable', requestId}); }
}
function safeDestroy(panorama) { try { panorama?.destroy?.(); } catch (_) {} }
function friendlyError(code) {
  switch (code) {
    case 'PANORAMA_NOT_FOUND': return 'V okol\u00ed vybran\u00e9ho bodu nen\u00ed dostupn\u00e9 panorama.';
    case 'MISSING_API_KEY':
    case 'WRONG_API_KEY': return 'Mapy.com odm\u00edtly API kl\u00ed\u010d. Zkontrolujte Nastaven\u00ed a omezen\u00ed kl\u00ed\u010de.';
    default: return 'Panoramu nelze na\u010d\u00edst. Zkontrolujte internet, API kl\u00ed\u010d a jeho kv\u00f3tu.';
  }
}
async function loadPano(data) {
  const id = ++generation;
  const requestId = data.requestId;
  reporter.reset();
  currentRequestId = requestId; currentPoint = null; currentCamera = null;
  safeDestroy(active);
  active = null;
  root.replaceChildren();
  const mount = document.createElement('div');
  mount.className = 'mount';
  root.appendChild(mount);
  report(requestId, 'loading', 'Hled\u00e1m nejbli\u017e\u0161\u00ed panorama\u2026');
  try {
    if (!readPosition(data)) throw new Error('Invalid coordinates');
    if (typeof Panorama === 'undefined') throw new Error('Library unavailable');
    const panorama = await Panorama.panoramaFromPosition({
      parent:mount, lon:data.lon, lat:data.lat, apiKey:data.apiKey,
      radius:data.radius || 80, yaw:'point', pitch:0, fov:1.2,
      showNavigation:true, lang:'cs'
      // Only an initial FOV, in radians. Never reset it on pano-place/pano-view.
      // The API's automatic window resizing stays enabled.
    });
    if (id !== generation) { safeDestroy(panorama); mount.remove(); return; }
    if (!panorama || (panorama.errorCode && panorama.errorCode !== 'NONE') || panorama.error) {
      safeDestroy(panorama);
      mount.remove();
      report(requestId, 'error', friendlyError(panorama?.errorCode));
      return;
    }
    active = panorama;
    report(requestId, 'ready');
    try { currentCamera = readCamera(panorama.getCamera?.()); } catch (_) {}
    position(requestId, panorama.info);
    panorama.addListener('pano-view', camera => {
      if (id === generation && active === panorama) {
        currentCamera = readCamera(camera) || currentCamera;
        reporter.changed();
      }
    });
    panorama.addListener('pano-place', place => {
      if (id === generation && active === panorama) {
        // A position event only moves the map marker. It must not resize/reload
        // the viewer or reset its camera. Report 'ready' once, after creation.
        position(requestId, place);
      }
    });
  } catch (_) {
    if (id !== generation) { mount.remove(); return; }
    safeDestroy(active); active = null; mount.remove();
    report(requestId, 'error', friendlyError());
  }
}
window.chrome?.webview?.addEventListener('message', event => {
  if (event.data?.type === 'location') void loadPano(event.data);
  else if (event.data?.type === 'camera-ack') reporter.ack(event.data);
});
window.addEventListener('pagehide', () => { ++generation; reporter.dispose(); safeDestroy(active); active = null; });
post({type:'ready'});
</script>
</body>
</html>
